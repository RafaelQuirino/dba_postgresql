services:
  # 1. Serviço do Banco de Dados
  postgresql:
    image: postgres:14
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cinetech_productions
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinetech_productions"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Serviço de Criação do Schema/Tabelas (Bronze)
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: db-migrator
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "init-db", "--yes"]

  # 3. Serviço de Ingestão de Dados (Bronze)
  data-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: data-ingestor
    depends_on:
      db-migrator:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "ingest-data"]

  # 4. Serviço que constrói a camada Silver (Views)
  trusted-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: trusted-builder
    depends_on:
      data-ingestor:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "build-trusted-layer"]
  
  # 5. Serviço que constrói a camada analytics (Tabelas)
  analytics-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: analytics-builder
    depends_on:
      trusted-builder:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "build-analytics-layer"]

  # 6. Serviço de setup de usuários e permissões
  permissions-setter:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: permissions-setter
    depends_on:
      analytics-builder:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "setup-permissions"]

  # 7. Serviço que cria as Views de Relatório (Analytics)
  reporting-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: reporting-builder
    depends_on:
      permissions-setter: # <-- Espera as permissões serem aplicadas
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "create-reporting-views"]

  # 8. Reporting Layer: KPI Views Builder
  kpi-builder:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: kpi-builder
    depends_on:
      reporting-builder: # <-- Waits for the previous step
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    command: ["flask", "create-kpi-views"] # <-- The command to automate

  # 9. Sua Aplicação Principal
  app:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: app-flask
    restart: always
    depends_on:
      kpi-builder: # <-- ATUALIZADO: Espera o passo final da pipeline
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
      - PYTHONPATH=/app
    ports:
      - "8000:5000"
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "apps.main:create_app()"]

  # 10. Interface Web do pgAdmin
  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile.pgadmin
    container_name: pgadmin-ui
    restart: always
    depends_on:
      kpi-builder: # <-- ATUALIZADO: Espera o passo final da pipeline
        condition: service_completed_successfully
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_SETUP_EMAIL: admin@admin.com
      PGADMIN_SETUP_PASSWORD: admin123
    volumes:
      - ./conf/pgadmin_servers.json:/pgadmin4/servers.json
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"

volumes:
  pg_data:
  pgadmin_data: