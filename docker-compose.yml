version: "3.9"

services:
  # 1. Serviço do Banco de Dados
  postgresql:
    image: postgres:14
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cinetech_productions # Importante: crie o banco aqui
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinetech_productions"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Serviço de Migração (usa o Dockerfile.python)
  db-migrator:
    build:
      context: .
      dockerfile: Dockerfile.python # <--- Usa o Dockerfile do Python
    container_name: db-migrator
    depends_on:
      postgresql:
        condition: service_healthy # Espera o DB estar pronto
    environment:
      # Variáveis para o script de migração
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
    command: ["sh", "-c", "flask init-db --yes"]

  # 3. Sua Aplicação Principal (também usa o Dockerfile.python)
  app:
    build:
      context: .
      dockerfile: Dockerfile.python # <--- Usa o mesmo Dockerfile do Python
    container_name: app-flask # Um nome claro para sua aplicação
    restart: always
    depends_on:
      db-migrator:
        # Só inicia DEPOIS que a migração terminou com sucesso
        condition: service_completed_successfully
    environment:
      # Variáveis para a aplicação
      - DATABASE_URL=postgresql://postgres:postgres123@postgresql:5432/cinetech_productions
      - FLASK_APP=apps.main
    ports:
      # Exemplo: Porta 8000 do seu PC para a porta 5000 do contêiner
      - "8000:5000"
    command: ["sh", "-c", "gunicorn --bind 0.0.0.0:5000 'apps.main:create_app()'"]

  # 4. Interface Web do pgAdmin (usa o Dockerfile.pgadmin)
  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile.pgadmin # <--- Usa o Dockerfile do pgAdmin
    container_name: pgadmin-ui # Nome claro para a interface
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      # Esta variável evita que o pgAdmin peça a senha mestre na primeira vez
      PGADMIN_SETUP_EMAIL: admin@admin.com
      PGADMIN_SETUP_PASSWORD: admin123
    volumes:
      # O arquivo de servidores é montado para autoconfigurar a conexão
      - ./conf/pgadmin_servers.json:/pgadmin4/servers.json
      - pgadmin_data:/var/lib/pgadmin
    ports:
      # Porta 8080 do seu PC para a porta 80 do contêiner
      - "8080:80"
    depends_on:
      db-migrator:
        # Também espera a migração para garantir que o banco esteja pronto para ser explorado
        condition: service_completed_successfully

volumes:
  pg_data:
  pgadmin_data: