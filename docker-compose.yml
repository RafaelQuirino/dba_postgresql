services:

  postgresql:
    image: postgres:17
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: cinetech_productions
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./conf/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
    expose:
      - 5432
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    build:
      context: .
      dockerfile: Dockerfile.pgadmin
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - ./conf/pgadmin_pass:/pgadmin4/pass
      - ./conf/pgadmin_servers.json:/pgadmin4/servers.json
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - 8080:80
    depends_on: 
      postgresql:
        condition: service_healthy
  
  ingestao-txt:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: ingestao-txt
    workdir: /app
    command: python ingestao_dados.py
    volumes:
      - ./homework/data:/data
      - ./homework/python:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgresql:
        condition: service_healthy
    restart: on-failure
    

volumes:
  pg_data:
  pgadmin_data:

