global
    log stdout format raw local0 info
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    retries 3
    timeout connect 5000
    timeout client 50000
    timeout server 50000

# Stats page
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123

# PostgreSQL cluster
listen postgres_cluster
    bind *:5000
    mode tcp
    balance roundrobin
    option redispatch
    retries 3
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    
    # Health check
    option tcp-check
    
    # Primary node (write operations)
    server postgresql-primary postgresql-primary:5432 check port 5432 maxconn 100 weight 100
    # Standby node (read operations)
    server postgresql-standby postgresql-standby:5432 check port 5432 maxconn 100 weight 50 
